// Android Auto vehicle energy model (SensorBatch field 23), recovered from Google Maps 26.43.00
// (com.google.android.apps.maps 1068844608) protobuf-lite descriptors with reference/lite_schema.py.
//
// Field numbers and wire types are exact (from the RawMessageInfo of the obfuscated classes, named in
// the trailing comments). protobuf-lite strips names; the names here follow Google's own
// "Vehicle energy model (v1.2)" schema (package maps.automotive.vehicle_energy_model, published in
// github.com/kangrio/CarService-AOSP proto/energy_model.proto), which has the same field numbers and
// wire types in every block. Maps only reads current energy and capacity on the phone. The rest goes
// to Google's servers unchanged (gfz.q() copies cdim -> cbjh 1:1, no unit conversion). See
// docs/ENERGY-MODEL.md for what egmp fills and how sure each value is.
syntax = "proto2";

package vem;

// Scalar with a second float. Maps' own demo models set value_float = 0 next to an int value.
message Quantity {                 // cdhx -> cbiu  (v1.2 IntWithUncertainty: mean, standard_deviation)
  optional int32 value = 1;
  optional float value_float = 2;
}

message FloatQuantity {            // cdhm -> cbit  (v1.2 FloatWithUncertainty)
  optional float value = 1;
  optional float value2 = 2;       // standard deviation; never set by Maps or the Ford sample
}

message XY {                       // cdhy -> cbiv  (v1.2 LossAtPower: power_watts, loss_watts)
  optional sint32 x = 1;           // ZIGZAG: raw varint 7816 = 3908
  optional Quantity y = 2;
}

message VehicleEnergyModel {       // cdim (AA wire) -> cbjh (Maps internal)
  optional Battery battery = 1;                  // -> cbjh.1
  optional RoadLoad road_load = 2;               // -> cbjh.2
  optional DrivetrainLoss drivetrain_loss = 3;   // -> cbjh.10
  optional MaxRegenPower max_regen_power = 4;    // -> cbjh.4
  optional BatteryLoss battery_loss = 5;         // -> cbjh.11
  repeated DrainAtTime aux_drain_at_time = 6;    // -> cbjh.6
  repeated DrainAtTemp aux_drain_at_temp = 7;    // -> cbjh.7
  optional ChargeTimeTables charge_time = 8;     // -> cbjh.8
  optional ChargingTime current_charging_time = 9;  // -> cbjh.9
  optional BatteryPreconditioning battery_preconditioning = 10;  // -> cbjh.13
  // cbjh.12 (cbiy: source info) is added by Maps itself, not sent by the HU.
}

message Battery {                  // cdio -> cbjj  (v1.2 VehicleInfo; field 1 reserved)
  optional Quantity mass_kg = 2;             // cbjj.i: Maps' demo models 2000-3175 (kg, not a Wh reserve)
  optional Quantity current_energy_wh = 3;   // cbjj.d: MUST be > 0 or Maps ignores the model
  optional Quantity capacity_wh = 4;         // cbjj.e: 100% point for the battery % display
  optional int32 hvac_status = 5;            // cbjj.f: 0 unknown, 1 off, 2 on
  optional float air_density = 6;            // cbjj.g: reference air density, kg/m^3 (Ford 1.293)
  optional float outside_temp_c = 7;         // cbjj.h
  optional float battery_temp_c = 8;         // cbjj.m: v1.2 "only required if battery preconditioning parameters are provided"
  optional uint32 peak_motor_power_w = 9;    // cbjj.j: Maps demos 170000 / 240000; v1.2 "only required for lightweight predictions"
  optional uint32 max_charging_rate_w = 10;  // cbjj.k: Maps demos 155000 / 150000; lightweight predictions
  optional bool heat_pump_equipped = 11;     // cbjj.l: lightweight predictions
  repeated EnumValue enum_values12 = 12;     // cbjj.n: not in v1.2 (newer)
}

message EnumValue {                // cdin -> cbji
  optional int32 kind = 1;         // 5 values (0..4), names stripped
  optional uint32 value = 2;
}

// F(v) = A + B*v + C*v^2. Maps re-routes when A changes >= 50, B >= 5, C >= 0.05.
message RoadLoad {                 // cdie -> cbjc
  optional FloatQuantity a_n = 1;          // N
  optional FloatQuantity b_n_per_mps = 2;  // N/(m/s)
  optional FloatQuantity c_n_per_mps2 = 3; // N/(m/s)^2
}

message DrivetrainLoss {           // cdhj -> cbik
  repeated SpeedRow rows = 7;      // x = power at the wheels (W), y = loss (W)
  optional uint32 uint8 = 8;
}
message SpeedRow {                 // cdhz -> cbiw
  optional float speed_mps = 1;
  repeated XY points = 2;
}

// v1.2: max REGEN power. egmp has filled .1 with the DC charge-power curve since the start (the
// Ford sample's shape); whether that ever affected charge times is car test #4.
message MaxRegenPower {            // cdib -> cbix
  repeated EnergyPower at_energy = 1;   // regeneration_rate_at_energy_level: energy Wh -> W
  repeated EnergyPower at_time = 2;     // regeneration_rate_at_time: relative time s -> W; unused by Ford
}
message EnergyPower {              // cdic / cdid -> cbja / cbjb
  optional int32 energy_wh = 1;
  optional uint32 power_w = 2;
}

message BatteryLoss {              // cdgt -> cbib
  repeated XY points = 4;          // x = battery power (W), y = loss (W); Ford is I^2*R, R ~ 0.03 ohm @ 400 V
}

// Future auxiliary drain; v1.2: held for > 15 min, then Maps falls back to DrainAtTemp.
message DrainAtTime {              // cdhi -> cbij. Maps re-routes when [0].relative_time_s changes >= 600 or [0].drain_w >= 500
  optional int32 relative_time_s = 1;
  optional Quantity drain_w = 3;
}

message DrainAtTemp {              // cdhh -> cbii
  optional float outside_temp_c = 1;
  optional Quantity hvac_drain_w = 2;
  optional Quantity battery_conditioning_drain_w = 3;
  optional Quantity total_drain_w = 4;  // the only one Ford fills
}

message ChargeTimeTables {         // cdhd -> cbif
  repeated ChargeCurve by_charger_power = 1;
  repeated ChargeCurvesAtTemp by_temp = 2;   // v1.2 charging_curves_at_temperature (battery temp); needs battery_temp_c
}
message ChargeCurve {              // cdhb -> cbid  (energy_wh = energy to full, seconds = time to full)
  optional int32 charger_power_w = 1;
  repeated EnergyTime points = 2;
}
message EnergyTime {               // cdha -> cbic
  optional int32 energy_wh = 1;
  optional int32 seconds = 2;
}
message ChargeCurvesAtTemp {       // cdhc -> cbie
  optional float temp_c = 1;
  repeated ChargeCurve curves = 2;
}

// v1.2: only while plugged in.
message ChargingTime {             // cdhf -> cbig
  optional int32 target_battery_level_wh = 1;
  optional Quantity time_remaining_s = 2;
}

// v1.2 BatteryPreconditioning (needs battery_temp_c).
message BatteryPreconditioning {   // cdgx -> cbjg. Maps re-routes when field 2 changes >= 500
  repeated PowerTemp target_temp_at_input_power = 1;     // charger W -> target pack C
  optional uint32 conditioning_power_w = 2;
  repeated TempEnergy energy_for_preconditioning = 3;    // target pack C -> extra Wh
  optional uint32 min_battery_level_wh = 4;              // below this, no preconditioning
  repeated PowerTemp max_temp_increase_at_station = 5;   // charger W -> max pack C rise while charging
}
message PowerTemp { optional uint32 input_power_w = 1; optional float temp_c = 2; }       // cdgw / cdgv
message TempEnergy { optional float target_temp_c = 1; optional uint32 energy_wh = 2; }  // cdgu
