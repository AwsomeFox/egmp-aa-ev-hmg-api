# Builds the HMG-API mod's two builds (egmp-aa-ev, egmp-aa-ev-standalone) for a release
# made in GitHub's UI and attaches them, with their NEMESIS packages:
# Releases -> Draft a new release -> tag v<version> (the "version" in
# hmgapi-mod/mod.json) -> Publish. To build again for an existing release (after a
# failed run, say): Actions -> Release -> Run workflow, with its tag.
#
# Needs the repository secret HMGAPI_AUTHOR_KEY: the contents of the HMG-API author
# key file (hmgapi.engine.Signing keygen). Every version must be signed with the
# same key, or HMG-API won't update the installed mod.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (v<version>)
        required: true

permissions:
  contents: write

env:
  # The mod is built with the HMG-API mod SDK hmgapi-sdk.json pins (hmgapi-mod/sdk.sh), and
  # tested beside this Wireless CarPlay + Android Auto mod, in its own repo from HMG-API 1.1.0.
  # Move the two together, to what an HMG-API release ships.
  WIRELESS_REF: v2.2.0-rc.5

jobs:
  hmgapi-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/checkout@v4
        with:
          repository: Open-HMG/hmgapi-wireless-cp-aa
          ref: ${{ env.WIRELESS_REF }}
          path: hmgapi-wireless-cp-aa

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: The tag is the mod's version
        id: version
        run: |
          v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' hmgapi-mod/mod.json | head -1)
          if [ "v$v" != "${{ steps.tag.outputs.tag }}" ]; then
            echo "::error::release tag ${{ steps.tag.outputs.tag }} isn't v$v, the version in hmgapi-mod/mod.json"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Android SDK (build-tools with d8, a platform android.jar)
        run: |
          ls "$ANDROID_HOME"/build-tools/*/d8 >/dev/null 2>&1 && ls "$ANDROID_HOME"/platforms/android-*/android.jar >/dev/null 2>&1 \
            || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" >/dev/null

      - name: The HMG-API mod SDK (hmgapi-sdk.json) and its hook maps
        run: sh hmgapi-mod/sdk.sh | sed 's/; export.*//' >> "$GITHUB_ENV"

      - name: Build and test
        env:
          WIRELESS: ${{ github.workspace }}/hmgapi-wireless-cp-aa/wireless-carplay-aa
        run: |
          sh hmgapi-mod/build.sh
          sh hmgapi-mod/test/run.sh

      - name: Signed packages
        env:
          AUTHOR_KEY: ${{ secrets.HMGAPI_AUTHOR_KEY }}
        run: |
          if [ -z "$AUTHOR_KEY" ]; then
            echo "::error::the HMGAPI_AUTHOR_KEY secret isn't set (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          umask 077
          printf '%s\n' "$AUTHOR_KEY" > "$RUNNER_TEMP/author.key"
          # HMG-API's signer wants the public key beside it (<key>.pub): derived from the private one
          base64 -d < "$RUNNER_TEMP/author.key" | openssl pkey -inform DER -pubout -outform DER | base64 -w0 > "$RUNNER_TEMP/author.key.pub"
          echo >> "$RUNNER_TEMP/author.key.pub"
          sh hmgapi-mod/build.sh "$RUNNER_TEMP/author.key"
          rm -f "$RUNNER_TEMP/author.key" "$RUNNER_TEMP/author.key.pub"
          ls -l "dist/egmp-aa-ev-${{ steps.version.outputs.version }}.zip" "dist/egmp-aa-ev-standalone-${{ steps.version.outputs.version }}.zip"

      - name: NEMESIS packages
        # the SDK's mknemesismod.sh: each signed mod as NEMESIS package hmgapi.<id> (each refuses the
        # other: mod.json "nemesis_conflicts"):
        #   <id>-<v>-nemesis.zip          for a USB stick, as NEMESIS's own downloads
        #   <id>-<v>-nemesis-package.zip  the package itself (NEMESIS Package Store)
        run: |
          for id in egmp-aa-ev egmp-aa-ev-standalone; do
            sh "$HMGAPI_SDK/bin/mknemesismod.sh" "dist/$id-${{ steps.version.outputs.version }}.zip" "$PWD/dist"
          done

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" --clobber \
            "dist/egmp-aa-ev-$V.zip" "dist/egmp-aa-ev-$V-nemesis.zip" "dist/egmp-aa-ev-$V-nemesis-package.zip" \
            "dist/egmp-aa-ev-standalone-$V.zip" "dist/egmp-aa-ev-standalone-$V-nemesis.zip" "dist/egmp-aa-ev-standalone-$V-nemesis-package.zip"
