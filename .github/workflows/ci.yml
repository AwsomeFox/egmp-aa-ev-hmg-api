# Builds and tests the HMG-API mod on every push and pull request, against the same
# HMG-API and Wireless mod as the release workflow (keep the two refs the same there).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HMGAPI_REF: v1.1.0-rc.2
  WIRELESS_REF: v2.2.0-rc.3

jobs:
  hmgapi-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Open-HMG/HMG-API
          ref: ${{ env.HMGAPI_REF }}
          path: HMG-API

      - uses: actions/checkout@v4
        with:
          repository: Open-HMG/hmgapi-wireless-cp-aa
          ref: ${{ env.WIRELESS_REF }}
          path: hmgapi-wireless-cp-aa

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (build-tools with d8, a platform android.jar)
        run: |
          ls "$ANDROID_HOME"/build-tools/*/d8 >/dev/null 2>&1 && ls "$ANDROID_HOME"/platforms/android-*/android.jar >/dev/null 2>&1 \
            || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" >/dev/null

      - name: Build and test
        env:
          HMGAPI: ${{ github.workspace }}/HMG-API
          WIRELESS: ${{ github.workspace }}/hmgapi-wireless-cp-aa/wireless-carplay-aa
        run: |
          sh hmgapi-mod/build.sh
          sh hmgapi-mod/test/run.sh

      - name: Same refs as the release workflow
        run: |
          for k in HMGAPI_REF WIRELESS_REF; do
            r=$(sed -n "s/^  $k: *//p" .github/workflows/release.yml)
            c=$(sed -n "s/^  $k: *//p" .github/workflows/ci.yml)
            [ "$r" = "$c" ] || { echo "::error::$k is $c here but $r in release.yml"; exit 1; }
          done
